# Verifier2 (waltid/verifier-api2) service configuration.
#
# Mounted read-only into the container at /waltid-verifier-api2/config (see docker-compose.yml).
# These are the service-wide DEFAULTS applied to every verification session; the per-session
# request body (presentation-request.json) can override them when needed.
#
# Validates: Requirements 4.2 (issuer signature validation via did:key resolution) and
# 4.3 (disclosed degree + institution present and verifiable) by making the credential-level
# signature policy and the SD-JWT presentation policies the default for all sessions.

# Identity this verifier presents to wallets as the OpenID4VP client / audience.
clientId = "verifier2"

# Base URL the wallet uses to fetch the authorization request and post its response.
# On the Compose network the verifier is reachable at http://verifier:7004; the request URI
# becomes {urlPrefix}/{sessionId}/request and the response URI {urlPrefix}/{sessionId}/response.
# Override per-session (url_config.url_prefix) when exposing via a public URL / ngrok.
urlPrefix = "http://verifier:7004/verification-session"
urlPrefix = ${?VERIFIER_URL_PREFIX}

# Authorization request scheme handed to the holder's wallet (standard OID4VP deep link).
urlHost = "openid4vp://authorize"

# Default policies applied to every verification session unless the request overrides them.
# vc_policies run against each received credential; vp_policies run against the presentation.
#   - signature                     : issuer signature check; the issuer did:key is resolved
#                                      to its public key before the signature is verified (Req 4.2).
#   - dc+sd-jwt/kb-jwt_signature     : holder key-binding — verifies the KB-JWT with the holder key.
#   - dc+sd-jwt/sd_hash-check        : SD-JWT disclosure integrity — recomputes and matches SD hashes.
#   - dc+sd-jwt/nonce-check          : presentation is bound to the challenge issued for the session.
#   - dc+sd-jwt/audience-check       : presentation audience matches this verifier.
defaultPolicies {
  vc_policies = [
    { policy = "signature" }
  ]
  vp_policies = [
    { policy = "dc+sd-jwt/kb-jwt_signature" }
    { policy = "dc+sd-jwt/sd_hash-check" }
    { policy = "dc+sd-jwt/nonce-check" }
    { policy = "dc+sd-jwt/audience-check" }
  ]
}
