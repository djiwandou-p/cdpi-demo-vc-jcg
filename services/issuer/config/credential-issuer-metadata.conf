# =============================================================================
# Issuer2 credential issuer metadata — walt.id/issuer-api2 (OpenID4VCI 1.0)
# =============================================================================
# Advertises the credential configurations this issuer supports. For this demo
# the catalog is intentionally minimal: a single Education Certificate issued as
# an IETF SD-JWT VC (format "dc+sd-jwt"). Each configuration declared here is
# paired with a deployment profile in issuer2-profiles.conf.
#
# References:
#   - Issuer2 getting started: https://docs.walt.id/community-stack/issuer2/getting-started
#   - Issuer2 setup:           https://docs.walt.id/community-stack/issuer2/setup
# Content was rephrased for compliance with licensing restrictions.
# =============================================================================

issuerDisplay = [
  {
    name = "CDPI Demo Education Issuer"
    locale = "en-US"
  }
]

credentialConfigurations = {

  # Education Certificate — IETF SD-JWT VC.
  # The vct is the stable credential type identifier wallets and verifiers key
  # off ("EducationCertificate", per the demo data model). All four subject
  # attributes (name, degree, institution, grades) are declared below; which of
  # them are selectively disclosable is defined in the matching profile.
  "EducationCertificate" = {
    format = "dc+sd-jwt"
    scope = "EducationCertificate"

    # Literal VCT published unchanged in issuer metadata and in the issued
    # credential's `vct` claim.
    vct = "EducationCertificate"

    # Issuer signs with an Ed25519 did:key (EdDSA); holder key binding is a
    # did:key proof produced by the wallet via the waltid-identity-sdk.
    credential_signing_alg_values_supported = ["EdDSA"]
    cryptographic_binding_methods_supported = ["did:key", "jwk"]
    proof_types_supported = {
      jwt = {
        proof_signing_alg_values_supported = ["EdDSA", "ES256"]
      }
    }

    credential_metadata = {
      display = [
        {
          name = "Education Certificate"
          locale = "en"
          description = "Demonstration education certificate issued as an SD-JWT VC."
          background_color = "#1E3A5F"
          text_color = "#FFFFFF"
        }
      ]
      claims = [
        {
          path = ["name"]
          display = [{ name = "Holder name", locale = "en" }]
        },
        {
          path = ["degree"]
          display = [{ name = "Degree", locale = "en" }]
        },
        {
          path = ["institution"]
          display = [{ name = "Institution", locale = "en" }]
        },
        {
          path = ["grades"]
          display = [{ name = "Grades", locale = "en" }]
        }
      ]
    }
  }
}
