# =============================================================================
# Issuer2 credential profiles — walt.id/issuer-api2 (OpenID4VCI 1.0)
# =============================================================================
# A profile is the deployment template for a credential configuration declared
# in credential-issuer-metadata.conf. It binds the issuer signing key, the
# default credential data (claim template), the claim mapping, and the
# selective-disclosure settings used when signing the SD-JWT VC.
#
# This demo defines a single profile: the Education Certificate.
#
# NOTE: Issuer2 reads profiles at startup only. Restart the container to pick up
# changes to this file.
# =============================================================================

# -----------------------------------------------------------------------------
# Issuer signing key — Ed25519 did:key.
#
# The demo issues and signs with a did:key identifier, as required by the design
# (issuer `iss` is a did:key resolvable via the waltid-identity-sdk). This is a
# fixed, well-known DEMO key — do NOT reuse it outside this demonstration.
#
#   did:key:z6MkghqZKawSkF4xoxjTnP1vsbwx2ivgU3aE1fJp8B5bhhY5
# -----------------------------------------------------------------------------
educationIssuerKey = {
  type = "jwk"
  jwk = {
    kty = "OKP"
    crv = "Ed25519"
    d = "tlw8TiBRASzp8nXBO3ZHYECVjFaoRNqE6UZ5drRGHPA"
    x = "IXNl4h9pG2U9SYrRWB7paY8NH6VAtjL9S6yw5BD7loo"
  }
}

educationIssuerDid = "did:key:z6MkghqZKawSkF4xoxjTnP1vsbwx2ivgU3aE1fJp8B5bhhY5"

profiles = {

  # Education Certificate — IETF SD-JWT VC, signed with the did:key above.
  educationCertificateSdJwt = {
    name = "Education Certificate"
    credentialConfigurationId = "EducationCertificate"

    # Sign with the demo did:key (Ed25519 / EdDSA).
    issuerKey = ${educationIssuerKey}
    issuerDid = ${educationIssuerDid}

    # Four-attribute claim template (demo defaults; overridable per-offer via
    # runtimeOverrides when the offer is created). Matches the demo data model:
    #   name, degree, institution, grades.
    credentialData = {
      "name" = "Ada Lovelace"
      "degree" = "BSc Computer Science"
      "institution" = "University of Example"
      "grades" = "First Class Honours"
    }

    mapping = {
      iat = "<timestamp-seconds>"
      nbf = "<timestamp-seconds>"
      exp = "<timestamp-in-seconds:365d>"
    }

    # Selective disclosure: ALL FOUR attributes are selectively disclosable, per
    # the data model. The holder reveals `degree` and `institution` and withholds
    # `grades` (and `name`, which is not requested) at presentation time.
    selectiveDisclosure = {
      fields = {
        "name" = { sd = true }
        "degree" = { sd = true }
        "institution" = { sd = true }
        "grades" = { sd = true }
      }
      decoyMode = "NONE"
      decoys = 0
    }
  }
}
